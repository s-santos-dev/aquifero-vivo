[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aquifero-vivo-backend"
version = "0.1.0"
description = "API do Aquífero Vivo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "geoalchemy2>=0.18,<1",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
data = ["pandas>=2.2,<3", "geopandas>=1.0,<2", "numpy>=2.1,<3", "scikit-learn>=1.6,<2"]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "numpy>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
